[project]
name = "trusted-monitoring"
version = "0.1.0"
description = "Trusted-monitoring control evaluations with local models (infrastructure in progress)"
requires-python = ">=3.12"
dependencies = [
    "control-arena>=19.0.0",
    "inspect-ai>=0.3.275",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
