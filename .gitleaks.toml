# gitleaks configuration. This repository is public from its first commit, so the hook in
# .githooks/pre-commit scans every staged change with the default rules and with three more
# rules for things that are not secrets in the usual sense but must not be published.
title = "trusted-monitoring"

[extend]
useDefault = true

[[rules]]
id = "tailnet-address"
description = "Tailscale address (100.64.0.0/10)"
regex = '''\b100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b'''

[[rules]]
id = "tailnet-name"
description = "Tailscale MagicDNS name"
regex = '''\b[a-z0-9-]+\.ts\.net\b'''

[[rules]]
id = "home-directory-path"
description = "Absolute path into a home directory"
regex = '''/(?:Users|home)/[A-Za-z0-9._-]+/'''

# Inspect logs: the APPS attack prompt ends with "secret input." and the next JSON value is a
# 32-hex attachment id of the log, which gitleaks' generic-api-key rule reads as a key. Allow
# exactly that shape and nothing else. The scrub check looks for the real key files on its own.
[[rules]]
id = "generic-api-key"
[rules.allowlist]
regexTarget = "match"
regexes = [
  '''secret input\."\s*,\s*"[0-9a-f]{32}"''',
  # A sample that printed the sandbox's environment: the official python Docker images carry the
  # release-signing key fingerprint in GPG_KEY (public; e2-gen-attack-probe-2, sample 5).
  '''GPG_KEY['"]?\s*[:=]\s*['"][0-9A-F]{40}['"]''',
]
